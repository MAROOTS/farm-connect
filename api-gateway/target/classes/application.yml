server:
  port: 8080

spring:
  application:
    name: api-gateway

  main:
    web-application-type: reactive

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      routes:

        - id: user-auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20

        - id: marketplace-featured-public
          uri: http://localhost:8082
          predicates:
              - Path=/api/marketplace/listings/featured

        - id: marketplace-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/marketplace/**
          filters:
            - name: AuthFilter

        - id: farm-management-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/farms/**
          filters:
            - name: AuthFilter

        - id: advisory-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/advisory/**
          filters:
            - name: AuthFilter

        - id: media-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/media/**
          filters:
            - name: AuthFilter

        - id: admin-users
          uri: http://localhost:8081
          predicates:
              - Path=/api/admin/**
          filters:
              - name: AuthFilter

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
jwt:
  secret: ${JWT_SECRET}